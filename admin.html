<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUCK — Customers</title>
<style>
:root{--green:#5f9b67;--ink:#111;--muted:#777;--line:#e8e8e8;--bg:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5vw,80px)}.brand{font-weight:700;color:var(--green);font-size:20px}.wrap{max-width:1180px;margin:0 auto;padding:48px 24px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700}.title{font-size:clamp(36px,6vw,70px);line-height:.95;margin:12px 0 38px}.login,.panel{background:#fff;border:1px solid var(--line);padding:24px}.login{max-width:520px}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid var(--line);background:#fff;padding:12px 14px}input{flex:1;min-width:220px}button{background:#111;color:#fff;border-color:#111;cursor:pointer;font-weight:700}.secondary{background:#fff;color:#111}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 18px}.stat{background:#fff;border:1px solid var(--line);padding:22px}.stat b{font-size:34px;display:block;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{min-width:260px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.pill{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px}.msg{margin-top:12px;font-size:13px;color:var(--muted)}.hidden{display:none}@media(max-width:600px){header{height:64px}.wrap{padding:32px 16px}.stats{grid-template-columns:1fr}.title{margin-bottom:26px}}
</style></head><body>
<header><div class="brand">Tuck</div><div class="eyebrow">PRIVATE ADMIN</div></header>
<main class="wrap"><div class="eyebrow">CUSTOMER DATABASE</div><h1 class="title">TUCK Customers.</h1>
<section id="login" class="login"><strong>Admin access</strong><p class="msg">Enter the admin token stored in your Cloudflare Worker secret. It stays only in this browser tab.</p><div class="row"><input id="token" type="password" autocomplete="off" placeholder="Admin token"><button id="enter">ENTER</button></div><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat"><span class="eyebrow">TOTAL SIGNUPS</span><b id="total">—</b></div><div class="stat"><span class="eyebrow">SUBSCRIBED</span><b id="subscribed">—</b></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search email"><select id="status"><option value="">All customers</option><option value="subscribed">Subscribed</option><option value="unsubscribed">Unsubscribed</option></select><button class="secondary" id="export">EXPORT CSV</button><button class="secondary" id="logout">LOG OUT</button></div>
<div class="table-wrap"><table><thead><tr><th>Email</th><th>Status</th><th>Source</th><th>Joined</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div id="dashMsg" class="msg"></div></section></main>
<script>
let customers=[]; const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){return sessionStorage.getItem('tuckAdminToken')||''} async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Authorization':'Bearer '+token(),'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(){try{const q=encodeURIComponent($('#search').value.trim()),st=encodeURIComponent($('#status').value);const d=await api('/api/admin/customers?q='+q+'&status='+st);customers=d.customers;$('#total').textContent=d.stats.total;$('#subscribed').textContent=d.stats.subscribed;$('#rows').innerHTML=customers.map(c=>`<tr><td>${esc(c.email)}</td><td><span class="pill">${c.subscribed?'Subscribed':'Unsubscribed'}</span></td><td>${esc(c.source)}</td><td>${esc(c.created_at)}</td><td><button class="secondary toggle" data-id="${c.id}" data-next="${c.subscribed?0:1}">${c.subscribed?'UNSUBSCRIBE':'RESUBSCRIBE'}</button></td></tr>`).join('')||'<tr><td colspan="5">No customers found.</td></tr>';$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#dashMsg').textContent=''}catch(e){sessionStorage.removeItem('tuckAdminToken');$('#login').classList.remove('hidden');$('#dashboard').classList.add('hidden');$('#loginMsg').textContent=e.message}}
$('#enter').onclick=()=>{sessionStorage.setItem('tuckAdminToken',$('#token').value);load()};$('#logout').onclick=()=>{sessionStorage.removeItem('tuckAdminToken');location.reload()};let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};$('#status').onchange=load;$('#rows').onclick=async e=>{const b=e.target.closest('.toggle');if(!b)return;await api('/api/admin/customer-subscription',{method:'POST',body:JSON.stringify({id:Number(b.dataset.id),subscribed:b.dataset.next==='1'})});load()};
$('#export').onclick=()=>{const vals=[['email','subscribed','source','created_at'],...customers.map(c=>[c.email,c.subscribed?'yes':'no',c.source,c.created_at])];const csv=vals.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tuck-customers.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
